[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langaai"
version = "0.1.0"
description = "Antigen-conditioned masked language model for antibody CDR sequences."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["antibody", "antigen", "protein-language-model", "cdr", "esm2"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0",
    # The checkpoint stores ESM-2's rotary embeddings in the layout
    # transformers 5.0 introduced. Under 4.x, loading it fails with missing
    # keys for every layer's rotary_embeddings.inv_freq.
    "transformers>=5.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.6", "jupyter"]

[project.scripts]
langaai = "langaai.cli:main"

[project.urls]
Source = "https://github.com/fbabd/LangAAI"
Weights = "https://huggingface.co/faisalashraf/langaai"

[tool.setuptools.packages.find]
include = ["langaai*"]
